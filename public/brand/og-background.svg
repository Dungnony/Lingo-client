<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" width="1672" height="941">
  <!-- Background + copy of the share image; the mascot is composited on top
       at render time (see docs/giao-dien.md, "Ảnh thương hiệu"). -->
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="og-stage" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </radialGradient>
  </defs>

  <rect width="1672" height="941" fill="url(#og-bg)"/>

  <!-- decorative letters -->
  <g font-family="Segoe UI, Arial, sans-serif" font-weight="800" fill="#ffffff" opacity="0.08">
    <text x="40" y="900" font-size="220">Aa</text>
    <text x="1420" y="160" font-size="150">Bb</text>
    <text x="900" y="930" font-size="140">Cc</text>
  </g>
  <g fill="#ffffff" opacity="0.1">
    <circle cx="1560" cy="820" r="120"/>
    <circle cx="980" cy="90" r="46"/>
  </g>

  <!-- round stage behind the mascot -->
  <circle cx="520" cy="520" r="380" fill="url(#og-stage)"/>
  <circle cx="520" cy="520" r="380" fill="none" stroke="#bfdbfe" stroke-width="6" opacity="0.6"/>

  <!-- speech bubble -->
  <g>
    <path d="M150 70 h270 a40 40 0 0 1 40 40 v110 a40 40 0 0 1 -40 40 h-60 l-10 52 l-46 -52 h-154 a40 40 0 0 1 -40 -40 v-110 a40 40 0 0 1 40 -40 z" fill="#ffffff"/>
    <text x="285" y="168" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="800" fill="#1d4ed8">Hello!</text>
    <text x="285" y="228" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="40" fill="#64748b">/həˈloʊ/</text>
  </g>

  <!-- brand block -->
  <g transform="translate(1250 0)" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(-75 150) scale(2.35)">
      <rect width="64" height="64" rx="18" fill="#ffffff"/>
      <path d="M22 16h7v25h14v7H22z" fill="#2563eb"/>
      <path d="M41 14h9a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-4l-4 4v-4a4 4 0 0 1-4-4v-6a4 4 0 0 1 3-4z" fill="#fbbf24"/>
    </g>
    <text x="0" y="465" font-size="168" font-weight="800" fill="#ffffff" letter-spacing="-4">Lingo<tspan fill="#fbbf24">.</tspan></text>
    <line x1="-300" y1="520" x2="-220" y2="520" stroke="#bfdbfe" stroke-width="3"/>
    <text x="0" y="532" font-size="38" font-weight="600" fill="#eff6ff">Nền tảng học tiếng Anh</text>
    <line x1="220" y1="520" x2="300" y2="520" stroke="#bfdbfe" stroke-width="3"/>
  </g>

  <!-- feature pills -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff">
    <g transform="translate(905 590)">
      <rect width="205" height="70" rx="35" fill="#ffffff" fill-opacity="0.16"/>
      <circle cx="36" cy="35" r="21" fill="#fbbf24"/>
      <path d="M26 28h8a4 4 0 0 1 4 4v12h-10a2 2 0 0 1-2-2zM46 28h-8a4 4 0 0 0-4 4v12h10a2 2 0 0 0 2-2z" fill="#1e40af"/>
      <text x="66" y="43">Học dễ hiểu</text>
    </g>
    <g transform="translate(1126 590)">
      <rect width="245" height="70" rx="35" fill="#ffffff" fill-opacity="0.16"/>
      <circle cx="36" cy="35" r="21" fill="#fbbf24"/>
      <path d="M24 45l9-10 6 6 10-13" fill="none" stroke="#1e40af" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="43">Tiến bộ mỗi ngày</text>
    </g>
    <g transform="translate(1387 590)">
      <rect width="245" height="70" rx="35" fill="#ffffff" fill-opacity="0.16"/>
      <circle cx="36" cy="35" r="21" fill="#fbbf24"/>
      <path d="M36 47s-12-7-12-15a6 6 0 0 1 12-2a6 6 0 0 1 12 2c0 8-12 15-12 15z" fill="#1e40af"/>
      <text x="66" y="43">Gần thế giới hơn</text>
    </g>
  </g>

  <!-- tagline -->
  <g font-family="Segoe UI, Arial, sans-serif" font-style="italic" fill="#eff6ff" text-anchor="middle">
    <text x="1250" y="770" font-size="40">Tiếng Anh — mở ra nhiều cơ hội hơn</text>
    <path d="M1010 795 Q1250 820 1490 790" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
