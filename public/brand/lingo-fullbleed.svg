<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Square, edge-to-edge version of lingo.svg for maskable / Apple touch
       icons: the OS applies its own mask, so the mark sits inside the 80%
       safe zone and the background must reach every corner. -->
  <defs>
    <linearGradient id="lingo-bg-full" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="url(#lingo-bg-full)"/>
  <g transform="translate(32 32) scale(0.72) translate(-32 -32)">
    <path d="M22 16h7v25h14v7H22z" fill="#ffffff"/>
    <path d="M41 14h9a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-4l-4 4v-4a4 4 0 0 1-4-4v-6a4 4 0 0 1 3-4z" fill="#fbbf24"/>
  </g>
</svg>
