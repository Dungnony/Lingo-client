<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1367 1150" role="img" aria-label="Lingo mascot">
  <defs>
    <linearGradient id="m-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="m-wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="m-belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="m-book" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="700" cy="1082" rx="290" ry="30" fill="#0f172a" opacity="0.12"/>

  <!-- tail feathers fanning out behind, to the lower right -->
  <g transform="translate(830 860)">
    <rect x="-34" y="0" width="68" height="300" rx="34" fill="#1e40af" transform="rotate(-70)"/>
    <rect x="-36" y="0" width="72" height="330" rx="36" fill="#ef4444" transform="rotate(-52)"/>
    <rect x="-32" y="0" width="64" height="280" rx="32" fill="#fbbf24" transform="rotate(-36)"/>
  </g>

  <!-- feet -->
  <g fill="#fb923c">
    <rect x="606" y="990" width="28" height="56" rx="14"/>
    <rect x="752" y="990" width="28" height="56" rx="14"/>
    <ellipse cx="620" cy="1046" rx="64" ry="28"/>
    <ellipse cx="766" cy="1046" rx="64" ry="28"/>
  </g>

  <!-- body -->
  <ellipse cx="690" cy="770" rx="245" ry="265" fill="url(#m-body)"/>
  <ellipse cx="700" cy="815" rx="160" ry="195" fill="url(#m-belly)"/>

  <!-- waving wing (behind the head edge, raised to the upper right) -->
  <g transform="translate(905 700) rotate(32)">
    <rect x="-62" y="-250" width="124" height="290" rx="62" fill="url(#m-wing)"/>
    <ellipse cx="-42" cy="-258" rx="26" ry="62" fill="#1e40af" transform="rotate(-14 -42 -258)"/>
    <ellipse cx="0" cy="-286" rx="30" ry="70" fill="#2563eb"/>
    <ellipse cx="42" cy="-258" rx="26" ry="62" fill="#38bdf8" transform="rotate(14 42 -258)"/>
    <path d="M-40 -150 Q0 -170 40 -150" fill="none" stroke="#fbbf24" stroke-width="14" stroke-linecap="round"/>
    <path d="M-40 -100 Q0 -120 40 -100" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  </g>
  <g fill="none" stroke="#93c5fd" stroke-width="12" stroke-linecap="round">
    <path d="M1152 330 Q1184 350 1192 386"/>
    <path d="M1182 276 Q1230 306 1242 356"/>
  </g>

  <!-- crest -->
  <g transform="translate(690 270)">
    <ellipse cx="-58" cy="-10" rx="34" ry="90" transform="rotate(-24 -58 -10)" fill="#1e40af"/>
    <ellipse cx="0" cy="-34" rx="38" ry="104" fill="#38bdf8"/>
    <ellipse cx="58" cy="-10" rx="34" ry="90" transform="rotate(24 58 -10)" fill="#1d4ed8"/>
  </g>

  <!-- head -->
  <circle cx="690" cy="470" r="235" fill="url(#m-body)"/>
  <ellipse cx="690" cy="470" rx="182" ry="128" fill="#f8fafc"/>

  <!-- eyebrows -->
  <g fill="none" stroke="#1e3a8a" stroke-width="16" stroke-linecap="round">
    <path d="M572 372 Q612 348 652 368"/>
    <path d="M728 368 Q768 348 808 372"/>
  </g>

  <!-- eyes -->
  <circle cx="612" cy="448" r="58" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
  <circle cx="620" cy="452" r="40" fill="#0f172a"/>
  <circle cx="634" cy="436" r="14" fill="#ffffff"/>
  <circle cx="606" cy="470" r="6" fill="#ffffff" opacity="0.8"/>
  <circle cx="768" cy="448" r="58" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
  <circle cx="776" cy="452" r="40" fill="#0f172a"/>
  <circle cx="790" cy="436" r="14" fill="#ffffff"/>
  <circle cx="762" cy="470" r="6" fill="#ffffff" opacity="0.8"/>

  <!-- cheeks -->
  <ellipse cx="540" cy="540" rx="40" ry="22" fill="#fb7185" opacity="0.55"/>
  <ellipse cx="840" cy="540" rx="40" ry="22" fill="#fb7185" opacity="0.55"/>

  <!-- beak (open, smiling) -->
  <g transform="translate(690 550) scale(1.3) translate(-690 -550)">
    <path d="M640 520 Q690 486 740 520 Q752 566 712 600 Q690 612 668 600 Q628 566 640 520 Z" fill="#f59e0b"/>
    <path d="M652 548 Q690 640 728 548 Q712 572 690 574 Q668 572 652 548 Z" fill="#b45309"/>
    <path d="M668 572 Q690 600 712 572 Q700 588 690 588 Q680 588 668 572 Z" fill="#fb7185"/>
    <ellipse cx="672" cy="522" rx="14" ry="7" fill="#fde68a" opacity="0.9"/>
  </g>

  <!-- arm wing hanging down behind the book -->
  <g transform="translate(468 680) rotate(14)">
    <rect x="-56" y="-10" width="112" height="250" rx="56" fill="url(#m-wing)"/>
  </g>

  <!-- book -->
  <g transform="translate(470 860) rotate(-10)">
    <rect x="-104" y="-130" width="208" height="262" rx="20" fill="#fff7ed"/>
    <rect x="-114" y="-138" width="208" height="262" rx="20" fill="url(#m-book)"/>
    <rect x="-96" y="-120" width="172" height="226" rx="12" fill="none" stroke="#fde68a" stroke-width="6" opacity="0.8"/>
    <text x="-10" y="-22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="60" font-weight="800" fill="#ffffff">ABC</text>
    <text x="-10" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#fff7ed">Lingo</text>
    <circle cx="-10" cy="88" r="9" fill="#fde68a"/>
  </g>

  <!-- wing tip gripping the book's corner -->
  <ellipse cx="378" cy="962" rx="48" ry="36" fill="#1e40af" transform="rotate(-20 378 962)"/>
</svg>
